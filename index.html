<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .envelope-container {
      text-align: center;
      cursor: pointer;
      animation: float 3s infinite ease-in-out;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }

    .envelope {
      width: 260px;
      transition: transform 0.3s;
    }

    .envelope-container:hover .envelope {
      transform: scale(1.05);
    }

    .letter {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.2);
      width: 80%; max-width: 420px;
      background: white;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 25px rgba(0,0,0,0.25);
      opacity: 0;
      transition: 0.6s ease;
      z-index: 10;
    }

    .letter.open {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .hearts {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .heart {
      position: absolute;
      font-size: 20px;
      animation: fly 4s linear infinite;
      opacity: 0.8;
    }

    @keyframes fly {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0.5; }
      100% { transform: translateY(-10vh) scale(1.4); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="hearts"></div>

  <div class="envelope-container" onclick="openLetter()">
    <img src="https://i.imgur.com/4ZQZQbt.png" class="envelope" alt="Envelope" />
    <p>Nhấn vào để mở thư ❤️</p>
  </div>

  <div class="letter" id="letterBox">
    <h2>Chúc mừng sinh nhật 🎉🎂</h2>
    <p>Chúc bạn có một ngày thật vui vẻ, hạnh phúc và đầy bất ngờ.</p>
    <p>Mong mọi điều tốt đẹp nhất sẽ đến với bạn ❤️</p>
  </div>

  <audio id="bgm" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_1e28c52f70.mp3?filename=happy-birthday-112521.mp3"></audio>

<script>
  function openLetter() {
    document.getElementById("letterBox").classList.add("open");
    document.getElementById("bgm").play();
  }

  function createHearts() {
    const hearts = document.querySelector('.hearts');
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.innerText = '❤️';
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.animationDuration = 3 + Math.random() * 3 + 's';
    heart.style.fontSize = (20 + Math.random()*20) + 'px';
    hearts.appendChild(heart);
    setTimeout(() => heart.remove(), 5000);
  }

  setInterval(createHearts, 300);
</script>

</body>
</html>
