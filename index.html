<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Nhi 🎂💗</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffe6ee;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: #ff4d7a;
            margin-top: 20px;
            font-size: 32px;
        }

        /* Slideshow */
        .slideshow {
            width: 90%;
            max-width: 330px;
            margin: 20px auto;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .slideshow img {
            width: 100%;
            display: none;
        }

        /* Nút mở thư */
        .btn-letter {
            padding: 12px 22px;
            background: #ff4d7a;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            margin-top: 25px;
            cursor: pointer;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.2);
        }

        /* Animation trái tim */
        .heart {
            position: fixed;
            bottom: -10px;
            color: #ff4d7a;
            font-size: 22px;
            animation: floatUp 3s linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-300px); opacity: 0; }
        }
    </style>
</head>

<body>

    <h1>🎉 Happy Birthday Nhi 🎉</h1>

    <!-- Slideshow -->
    <div class="slideshow">
        <img src="https://i.ibb.co/7JLjVSKN/image1.jpg" style="display:block;">
        <img src="https://i.ibb.co/ccc25W2b/image2.jpg">
        <img src="https://i.ibb.co/FLLgN6Lx/image3.jpg">
        <img src="https://i.ibb.co/MDRXCvBG/image4.jpg">
        <img src="https://i.ibb.co/hxWJnSBs/image5.jpg">
        <img src="https://i.ibb.co/qYChjQBX/image6.jpg">
        <img src="https://i.ibb.co/sdhHHbVf/image7.jpg">
        <img src="https://i.ibb.co/jknCL4QD/image8.jpg">
        <img src="https://i.ibb.co/bgNYYPrv/image9.jpg">
    </div>

    <!-- Nút mở thư -->
    <button class="btn-letter" onclick="window.location.href='letter.html'">
        💌 Mở thư gửi Nhi 💌
    </button>

    <!-- Nhạc -->
    <audio id="bgm" autoplay loop>
        <source src="https://v16m-default.akamaized.net/2a815a40fa…" type="audio/mp3">
    </audio>

    <script>
        // Slideshow
        let index = 0;
        const imgs = document.querySelectorAll(".slideshow img");

        setInterval(() => {
            imgs[index].style.display = "none";
            index = (index + 1) % imgs.length;
            imgs[index].style.display = "block";
        }, 2000);

        // Hiệu ứng tim rơi
        function createHeart() {
            const heart = document.createElement("div");
            heart.className = "heart";
            heart.innerHTML = "❤️";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = 2 + Math.random() * 2 + "s";
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 3000);
        }
        setInterval(createHeart, 500);
    </script>

</body>
  </html>
